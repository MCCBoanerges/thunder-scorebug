name: Cleanup (one-time)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded files into logos/ and web/
        run: |
          set -e
          mkdir -p logos web
          for f in *.png; do
            case "$f" in scorebug.png|scoreboard.png) continue;; esac
            git mv "$f" "logos/$f"
          done
          git mv index.html web/index.html
          git rm -q scorebug.yml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -m "Move logos into logos/, index.html into web/, drop stray scorebug.yml"
          git push
